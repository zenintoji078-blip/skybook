<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyBook — Your journey starts here</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .entrance {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--cloud);
    overflow: hidden;
    padding: 40px 24px;
  }
  .entrance img.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
  }
  .entrance::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(11,29,58,0.55) 0%, rgba(11,29,58,0.75) 55%, rgba(11,29,58,0.95) 100%);
    z-index: -1;
  }
  .entrance-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.5rem;
    margin-bottom: 40px;
  }
  .entrance-brand .mark { width: 34px; height: 34px; }
  .entrance-brand .mark path { stroke: var(--gold); }
  .entrance h1 {
    font-size: clamp(2.4rem, 6vw, 4rem);
    line-height: 1.05;
    max-width: 720px;
  }
  .entrance h1 em {
    font-style: normal;
    color: var(--gold-bright);
  }
  .entrance p.lead {
    margin-top: 20px;
    font-size: 1.1rem;
    color: var(--slate);
    max-width: 460px;
  }
  .entrance .enter-btn {
    margin-top: 40px;
    font-size: 1rem;
    padding: 16px 40px;
  }
  .entrance .scroll-hint {
    margin-top: 28px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--slate);
  }
</style>
</head>
<body>

<div class="entrance">
  <img class="bg" src="https://images.unsplash.com/photo-1748864459512-acde6546aa40?w=1800&q=70&auto=format&fit=crop" alt="Airplane wing above the clouds at sunset">

  <div class="entrance-brand">
    <svg class="mark" viewBox="0 0 32 32" fill="none"><path d="M4 20 L28 12 M28 12 L20 12 M28 12 L23 19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    SkyBook
  </div>

  <h1>Every great trip starts with <em>one click.</em></h1>
  <p class="lead">Search fares, pick your seat, and get your boarding pass — all in one flight-smooth booking flow.</p>

  <a href="home.html" class="btn btn-primary enter-btn">Enter SkyBook</a>
  <div class="scroll-hint">128 destinations &middot; 40+ airlines</div>
</div>

</body>
</html>
